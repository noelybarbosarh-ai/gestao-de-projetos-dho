<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Projetos e Atividades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F1F2F7; --surface:#FFFFFF; --surface-soft:#F7F8FC; --border:#E7E8F1;
    --text:#12131A; --text-soft:#52545C; --text-faint:#75767E;
    --primary:#4F46E5; --primary-hover:#4338CA; --primary-soft:#EEEDFD;
    --slate:#6B7280; --slate-soft:#EEF0F3;
    --info:#2563EB; --info-soft:#E7EFFE;
    --warning:#D97706; --warning-soft:#FDF1DF;
    --yellow:#CA8A04; --yellow-soft:#FEF3C7;
    --success:#16A34A; --success-soft:#E6F6EA;
    --danger:#DC2626; --danger-soft:#FCE8E8;
    --gold:#B98B0E; --gold-soft:#FBF0D2;
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(16,17,26,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 45%,#DB2777 100%);background-attachment:fixed;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:32px 32px 80px;}
  button{font-family:inherit;}

  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 8px 30px rgba(16,17,26,.10);padding:36px 32px;width:100%;max-width:360px;}
  .login-card h1{font-size:1.3rem;font-weight:800;margin:0 0 4px;}
  .login-card p.sub{color:var(--text-soft);font-size:0.85rem;margin:0 0 24px;}
  .login-card form{display:flex;flex-direction:column;gap:14px;}
  .login-card .btn-primary{width:100%;padding:12px;font-size:0.9rem;}

  /* Sidebar */
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:linear-gradient(165deg,#1C1730 0%,#2C2350 55%,#3B2E6B 100%);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;box-sizing:border-box;overflow-y:auto;}
  .sb-logo-row{display:flex;align-items:center;gap:10px;padding:0 6px;margin-bottom:22px;}
  .sb-logo{width:32px;height:32px;border-radius:9px;background:var(--primary);color:#fff;font-weight:800;font-size:0.95rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sb-logo-txt{color:#fff;font-size:0.78rem;font-weight:800;line-height:1.25;}
  .sb-logo-txt span{display:block;color:#B9B4D6;font-weight:500;font-size:0.64rem;margin-top:1px;}

  .sb-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .sb-item{background:none;border:none;color:#CFC9E8;cursor:pointer;border-radius:9px;display:flex;align-items:center;gap:9px;padding:9px 10px;font-size:0.78rem;font-weight:600;width:100%;text-align:left;}
  .sb-item svg{width:16px;height:16px;flex-shrink:0;}
  .sb-item span:not(.chev){flex:1;}
  .sb-item .chev{font-size:0.6rem;opacity:.7;transition:transform .15s;flex:none;}
  .sb-item.open .chev{transform:rotate(90deg);}
  .sb-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .sb-item.active{background:rgba(255,255,255,0.14);color:#fff;}

  .sb-group-label{font-size:0.62rem;color:#8983AE;font-weight:700;margin:14px 10px 4px;}

  .sb-sublist{display:none;flex-direction:column;gap:1px;padding-left:10px;margin:2px 0 6px;border-left:1px solid rgba(255,255,255,0.1);}
  .sb-sublist.expanded{display:flex;}
  .sb-subitem{background:none;border:none;color:#B9B4D6;cursor:pointer;border-radius:8px;padding:7px 10px;font-size:0.73rem;font-weight:600;text-align:left;width:100%;}
  .sb-subitem:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .sb-subitem.active{background:rgba(255,255,255,0.14);color:#fff;}
  .sb-empty{color:#6F6A8E;font-size:0.7rem;padding:6px 10px;}

  .sb-bottom{display:flex;flex-direction:column;gap:4px;padding-top:14px;margin-top:10px;border-top:1px solid rgba(255,255,255,0.12);}
  .sb-bottom-row{display:flex;align-items:center;gap:9px;padding:4px 6px 10px;}
  .sb-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1C1730;font-weight:800;font-size:0.68rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sb-who{min-width:0;}
  .sb-name{color:#fff;font-size:0.76rem;font-weight:700;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-role{color:#B9B4D6;font-size:0.66rem;margin:1px 0 0;}
  .sb-link{background:none;border:none;color:#B9B4D6;cursor:pointer;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:0.73rem;font-weight:600;width:100%;text-align:left;}
  .sb-link svg{width:15px;height:15px;flex-shrink:0;}
  .sb-link:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .sb-link.danger:hover{color:#F5A3A3;}
  .pwd-form-sb{display:flex;flex-direction:column;gap:6px;padding:6px 6px 0;}
  .pwd-form-sb input{font-size:0.72rem;padding:7px 9px;}

  @media (max-width:900px){
    .sidebar{width:74px;padding:16px 8px;}
    .sb-logo-txt, .sb-item span:not(.chev), .sb-item .chev, .sb-group-label, .sb-sublist, .sb-name, .sb-role, .sb-link span{display:none;}
    .sb-item, .sb-link{justify-content:center;}
    .sb-bottom-row{justify-content:center;}
  }
  .role-badge{font-size:0.7rem;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.02em;}
  .role-Proprietário{background:var(--gold-soft);color:var(--gold);}
  .role-Administrador{background:var(--primary-soft);color:var(--primary);}
  .role-Líder{background:var(--info-soft);color:var(--info);}
  .role-Usuário{background:var(--slate-soft);color:var(--slate);}
  .link-btn{background:none;border:none;color:var(--primary);font-weight:700;font-size:0.8rem;cursor:pointer;padding:6px 8px;}
  .link-btn.danger{color:var(--danger);}
  .pwd-form{display:flex;gap:6px;align-items:center;margin-top:8px;flex-basis:100%;}
  .pwd-form input{font-size:0.82rem;padding:8px 10px;}

  .error-box{background:var(--danger-soft);color:var(--danger);padding:13px 18px;border-radius:var(--radius-md);font-size:0.85rem;margin-bottom:20px;font-weight:600;}
  .info-box{background:var(--success-soft);color:var(--success);padding:13px 18px;border-radius:var(--radius-md);font-size:0.85rem;margin-bottom:20px;font-weight:600;}
  .loading{color:var(--text-soft);font-size:0.9rem;padding:40px 0;text-align:center;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px 24px;margin-bottom:20px;}
  .card-title{font-size:0.95rem;font-weight:700;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;}
  .card-title .toggle{font-size:0.78rem;font-weight:600;color:var(--primary);cursor:pointer;background:none;border:none;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:0.74rem;color:var(--text-soft);font-weight:600;}
  input, select, textarea{font-family:'Plus Jakarta Sans',sans-serif;font-size:0.88rem;padding:10px 12px;background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);transition:border-color .15s, box-shadow .15s;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}

  .btn{border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:0.85rem;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-ghost{background:var(--surface-soft);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--border);}

  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  .admin-col{border-left:none;}
  .admin-col + .admin-col{border-left:1px solid var(--border);padding-left:32px;}
  .mini-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:260px;overflow:auto;padding-right:4px;}
  .mini-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:0.85rem;}
  .mini-item .info{min-width:0;}
  .mini-item .sub{color:var(--text-faint);font-size:0.74rem;display:block;margin-top:2px;}
  .mini-item .btn-row{display:flex;gap:6px;flex-shrink:0;}
  .mini-item .btn-row button{font-size:0.72rem;padding:6px 12px;white-space:nowrap;}
  .mini-form{display:grid;gap:10px;align-items:end;}
  .mini-form .field label{display:block;}

  .breadcrumb{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;box-shadow:var(--shadow-sm);}
  .breadcrumb .back{background:none;border:none;color:var(--primary);font-weight:700;font-size:0.85rem;cursor:pointer;padding:6px 0;}
  .breadcrumb h2{margin:0;font-size:1.25rem;font-weight:800;}
  .breadcrumb .desc{color:var(--text-soft);font-size:0.85rem;margin:2px 0 0;}

  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:20px;}
  .project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px 20px;cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .project-card:hover{box-shadow:0 4px 16px rgba(16,17,26,.10);transform:translateY(-1px);}
  .project-card h3{margin:0 0 6px;font-size:1rem;font-weight:800;}
  .project-card p{margin:0 0 10px;font-size:0.8rem;color:var(--text-soft);line-height:1.4;min-height:2.2em;}
  .project-card .foot{display:flex;justify-content:space-between;align-items:center;font-size:0.74rem;color:var(--text-faint);font-weight:600;}
  .project-card .celula-tag{background:var(--info-soft);color:var(--info);padding:3px 9px;border-radius:999px;}

  .stats{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-bottom:20px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px 18px;}
  .stat .n{font-size:1.6rem;font-weight:800;line-height:1;letter-spacing:-0.02em;color:var(--text);}
  .stat .l{font-size:0.76rem;color:var(--text-soft);margin-top:6px;font-weight:600;}
  .stat.dot-backlog{background:#475569;border-color:#475569;}
  .stat.dot-backlog .n, .stat.dot-backlog .l{color:#fff;}
  .stat.dot-afazer{background:var(--primary);border-color:var(--primary);}
  .stat.dot-afazer .n, .stat.dot-afazer .l{color:#fff;}
  .stat.dot-andamento{background:var(--yellow);border-color:var(--yellow);}
  .stat.dot-andamento .n, .stat.dot-andamento .l{color:#1F1500;}
  .stat.dot-aprovacao{background:var(--info);border-color:var(--info);}
  .stat.dot-aprovacao .n, .stat.dot-aprovacao .l{color:#fff;}
  .stat.dot-concluido{background:var(--success);border-color:var(--success);}
  .stat.dot-concluido .n, .stat.dot-concluido .l{color:#fff;}
  .stat.dot-atrasadas{background:var(--danger);border-color:var(--danger);}
  .stat.dot-atrasadas .n, .stat.dot-atrasadas .l{color:#fff;}

  form.add{display:grid;grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));gap:12px;align-items:end;}
  form.add .obs{grid-column:1 / -1;}
  form.add .obs textarea{width:100%;min-height:44px;resize:vertical;}

  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .col{background:rgba(255,255,255,0.94);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:16px;min-height:120px;}
  .col h2{font-weight:700;font-size:0.88rem;margin:2px 4px 14px;display:flex;align-items:center;gap:8px;}
  .col h2 .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .col-backlog h2 .dot{background:var(--text-faint);}
  .col-afazer h2 .dot{background:var(--slate);} .col-andamento h2 .dot{background:var(--yellow);}
  .col-aprovacao h2 .dot{background:var(--info);} .col-concluido h2 .dot{background:var(--success);}
  .col h2 .count{margin-left:auto;color:var(--text-faint);font-weight:600;font-size:0.78rem;background:var(--surface-soft);padding:2px 8px;border-radius:999px;}

  .item{background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;transition:box-shadow .15s, opacity .15s;cursor:grab;}
  .item.dragging{opacity:0.4;}
  .col.drag-over{outline:2px dashed var(--primary);outline-offset:-4px;background:var(--primary-soft);}
  .item:hover{box-shadow:var(--shadow-sm);}
  .item:last-child{margin-bottom:0;}
  .item .prio-bar{width:32px;height:5px;border-radius:99px;margin-bottom:9px;}
  .item .prio-bar.pr-alta{background:var(--danger);}
  .item .prio-bar.pr-media{background:var(--warning);}
  .item .prio-bar.pr-baixa{background:var(--success);}
  .avatar{height:22px;padding:0 10px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;white-space:nowrap;background:var(--primary-soft);color:var(--primary-hover);}
  .item .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .item .top-row .titulo{flex:1;min-width:0;}
  .item .quem{display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text-soft);font-weight:600;}
  .item .titulo{font-size:0.88rem;font-weight:700;line-height:1.35;}
  .item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center;}
  .tag{font-size:0.68rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary);}
  .tag.pr-alta{background:var(--danger-soft);color:var(--danger);}
  .tag.pr-media{background:var(--warning-soft);color:var(--warning);}
  .tag.pr-baixa{background:var(--success-soft);color:var(--success);}
  .tag.overdue{background:var(--danger-soft);color:var(--danger);}
  .tag.responsavel{background:var(--slate-soft);color:var(--slate);}
  .item .obs{font-size:0.8rem;color:var(--text-soft);margin-top:8px;line-height:1.45;}
  .item .admin-dates{font-size:0.7rem;color:var(--text-faint);margin-top:8px;line-height:1.5;border-top:1px dashed var(--border);padding-top:8px;}
  .item .actions{display:flex;gap:6px;margin-top:11px;align-items:center;flex-wrap:wrap;}
  .item .actions select{font-size:0.72rem;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-weight:600;}
  .item .del, .item .edit-btn, .item .save, .item .cancel, .item .tasks-btn{font-size:0.74rem;font-weight:700;background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:var(--radius-sm);}
  .item .del{color:var(--danger);} .item .del:hover{background:var(--danger-soft);}
  .item .edit-btn, .item .tasks-btn{color:var(--primary);} .item .edit-btn:hover, .item .tasks-btn:hover{background:var(--primary-soft);}

  .edit-form{display:flex;flex-direction:column;gap:8px;}
  .edit-form input, .edit-form select, .edit-form textarea{width:100%;}
  .edit-row{display:flex;gap:8px;} .edit-row > *{flex:1;}
  .edit-actions{display:flex;gap:8px;margin-top:2px;}
  .edit-actions .save{color:#fff;background:var(--primary);border-radius:var(--radius-sm);padding:7px 14px;}
  .edit-actions .cancel{color:var(--text-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 14px;}

  .task-panel{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .task-item{display:flex;align-items:center;gap:8px;font-size:0.8rem;padding:4px 0;}
  .task-item.done .txt{text-decoration:line-through;color:var(--text-faint);}
  .task-item input[type=checkbox]{width:15px;height:15px;flex-shrink:0;}
  .task-item .del-task{margin-left:auto;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:0.7rem;}
  .task-add{display:flex;gap:6px;margin-top:8px;}
  .task-add input{flex:1;font-size:0.8rem;padding:7px 9px;}
  .task-add button{font-size:0.75rem;padding:7px 12px;}

  .empty{color:var(--text-faint);font-size:0.82rem;padding:10px 4px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,15,40,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:var(--surface);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,0.25);}
  .modal-box select{width:100%;}

  .leaderboard{display:flex;flex-direction:column;gap:8px;}
  .lb-row{display:flex;align-items:center;gap:12px;font-size:0.85rem;}
  .lb-rank{width:22px;font-weight:800;color:var(--text-faint);}
  .lb-name{flex:0 0 160px;font-weight:700;}
  .lb-bar-wrap{flex:1;background:var(--surface-soft);border-radius:999px;height:10px;overflow:hidden;}
  .lb-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:999px;}
  .lb-pts{width:60px;text-align:right;font-weight:700;color:var(--text-soft);font-size:0.8rem;}

  /* Dashboard Visão Geral */
  .dg-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .dg-head h2{margin:0 0 4px;font-size:1.25rem;font-weight:800;}
  .dg-head p{margin:0;color:var(--text-soft);font-size:0.85rem;}
  .period-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:2px;}
  .period-btn{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:0.78rem;font-weight:600;color:var(--text-soft);cursor:pointer;}
  .period-btn.active{background:var(--primary);color:#fff;}

  .dg-section{margin-bottom:24px;}
  .dg-section-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;}
  .dg-section-head .idx{font-size:0.72rem;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .dg-section-head h3{font-size:0.88rem;font-weight:800;margin:0;}

  .dg-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .dg-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:15px 16px 13px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
  .dg-kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary);opacity:.5;}
  .dg-kpi.alert::before{background:var(--danger);opacity:1;}
  .dg-kpi .l{font-size:0.72rem;color:var(--text-soft);margin-bottom:8px;font-weight:600;}
  .dg-kpi .v{font-size:1.6rem;font-weight:800;line-height:1;}
  .dg-kpi .v.alert{color:var(--danger);}
  .dg-kpi .d{font-size:0.72rem;margin-top:7px;font-weight:700;color:var(--success);}
  .dg-kpi .d.down{color:var(--danger);}

  .dg-two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
  .dg-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px 18px;}
  .dg-panel h4{font-size:0.8rem;font-weight:800;margin:0 0 12px;}

  .dg-table{width:100%;border-collapse:collapse;font-size:0.8rem;}
  .dg-table th{text-align:left;color:var(--text-faint);font-weight:700;font-size:0.68rem;padding:0 8px 7px;border-bottom:1px solid var(--border);}
  .dg-table td{padding:8px 8px;border-bottom:1px solid var(--border);}
  .dg-table tr:last-child td{border-bottom:none;}
  .dg-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:0.68rem;font-weight:700;white-space:nowrap;}
  .dg-pill.risk{background:var(--danger-soft);color:var(--danger);}
  .dg-pill.warn{background:var(--warning-soft);color:var(--warning);}

/* ---------- Dashboard: período e métricas ---------- */
const PERIODO_DIAS = { semana:7, mes:30, trimestre:90 };
function periodoRangeGeral(p){
  const dias = PERIODO_DIAS[p] || 30;
  const fim = new Date();
  const inicio = new Date(fim.getTime() - dias*86400000);
  const inicioAnterior = new Date(inicio.getTime() - dias*86400000);
  return { dias, fim, inicio, inicioAnterior, fimAnterior: inicio };
}
function diasEntreDatas(d1, d2){ return (new Date(d2) - new Date(d1)) / 86400000; }
function mediaCicloDias(lista){
  const validas = lista.filter(a => a.data_recebimento && a.data_conclusao);
  if(!validas.length) return null;
  const soma = validas.reduce((s,a) => s + diasEntreDatas(a.data_recebimento, a.data_conclusao), 0);
  return soma / validas.length;
}
function inicioSemana(d){
  const dt = new Date(d);
  const diaSemana = dt.getDay();
  const seg = new Date(dt.getTime() - ((diaSemana+6)%7)*86400000);
  seg.setHours(0,0,0,0);
  return seg;
}

/* ---------- Boot / sessão ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, sess) => {
    session = sess;
    if(!sess){ meuPerfil = null; renderRoot(); }
  });
  if(session) await afterLogin();
  else renderRoot();
}

async function afterLogin(){
  const { data, error } = await sb.from('usuarios').select('*').eq('auth_user_id', session.user.id).maybeSingle();
  if(error || !data){
    showError('Login feito, mas não encontramos seu perfil. Fale com um administrador.');
    renderRoot();
    return;
  }
  meuPerfil = data;
  await loadAll();
}

function renderRoot(){

  }

      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </div></div>`;
}

function attachLoginListeners(){
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const matricula = document.getElementById('loginMatricula').value.trim();
    const senha = document.getElementById('loginSenha').value;
    if(!matricula || !senha) return;
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Entrando…';
    let email = matricula;
    if(!email.includes('@')){
      const { data: encontrado, error: lookupError } = await sb.rpc('email_da_matricula', { m: matricula });
      if(lookupError || !encontrado){
        showError('Matrícula/e-mail ou senha incorretos.');
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      email = encontrado;
    }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error){
      showError('Matrícula ou senha incorretas.');
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }
    session = data.session;
    await afterLogin();
  });
}

      sb.from('tarefas').select('*').order('created_at'),
      sb.from('empresas').select('*').order('nome')

    for(const r of [c,u,p,a,t,emp]) if(r.error) throw r.error;
    celulas = c.data; usuarios = u.data; projetos = p.data; atividades = a.data; tarefas = t.data; empresas = emp.data;

    renderRoot();

function minhasAtividadesHtml(u){
  const lista = atividades.filter(a => a.responsavel_id === u.id || a.aprovador_id === u.id);

  const statsHtml = `<div class="stats">
    <div class="stat"><div class="n">${lista.length}</div><div class="l">total</div></div>
    <div class="stat dot-backlog"><div class="n">${lista.filter(a=>a.status==='Backlog').length}</div><div class="l">backlog</div></div>
    <div class="stat dot-afazer"><div class="n">${lista.filter(a=>a.status==='A fazer').length}</div><div class="l">a fazer</div></div>
    <div class="stat dot-andamento"><div class="n">${lista.filter(a=>a.status==='Em andamento').length}</div><div class="l">em andamento</div></div>
    <div class="stat dot-aprovacao"><div class="n">${lista.filter(a=>a.status==='Em aprovação').length}</div><div class="l">em aprovação</div></div>

  </div>`;

  const board = STATUSES.map(status => {

    </div>

}

function visaoGeralHtml(u){
  const { dias, fim, inicio, inicioAnterior, fimAnterior } = periodoRangeGeral(periodoGeral);
  const diasAtraso = (a) => Math.floor((new Date() - new Date(a.prazo_acordado + 'T23:59:59')) / 86400000);

  /* ---- Bloco 1: resumo ---- */
  const ativas = atividades.filter(a => a.status !== 'Concluído');
  const totalAtrasadas = atividades.filter(a => isOverdue(a));
  const concluidas = atividades.filter(a => a.status === 'Concluído');
  const concluidasPeriodo = concluidas.filter(a => a.data_conclusao && new Date(a.data_conclusao) > inicio && new Date(a.data_conclusao) <= fim);
  const concluidasAnterior = concluidas.filter(a => a.data_conclusao && new Date(a.data_conclusao) > inicioAnterior && new Date(a.data_conclusao) <= fimAnterior);
  const deltaConcluidas = concluidasAnterior.length ? Math.round((concluidasPeriodo.length - concluidasAnterior.length) / concluidasAnterior.length * 100) : (concluidasPeriodo.length > 0 ? 100 : 0);
  const taxaConclusao = atividades.length ? Math.round(concluidas.length / atividades.length * 100) : 0;
  const projetosAtivos = projetos.filter(p => atividades.some(a => a.projeto_id === p.id && a.status !== 'Concluído')).length;

  /* ---- Bloco 2: risco ---- */
  const atrasadasOrdenadas = [...totalAtrasadas].sort((a,b) => diasAtraso(b) - diasAtraso(a)).slice(0, 8);
  const emAprovacao = atividades.filter(a => a.status === 'Em aprovação' && a.aprovador_id);
  const gargaloMap = {};
  emAprovacao.forEach(a => { gargaloMap[a.aprovador_id] = (gargaloMap[a.aprovador_id]||0) + 1; });
  const gargalo = Object.entries(gargaloMap).map(([id,n]) => ({ nome: usuarioNome(id), n })).sort((a,b) => b.n - a.n);

  const semaforoCelulas = celulas.map(c => {
    const ativasCelula = atividades.filter(a => a.celula_id === c.id && a.status !== 'Concluído');
    const atrasadasCelula = ativasCelula.filter(a => isOverdue(a));
    const pct = ativasCelula.length ? Math.round(atrasadasCelula.length / ativasCelula.length * 100) : 0;
    const cor = !ativasCelula.length ? null : pct > 25 ? 'r' : pct >= 10 ? 'y' : 'g';
    return { nome: c.nome, pct, cor, ativas: ativasCelula.length };
  });

  /* ---- Bloco 3: carga de trabalho ---- */
  const cargaPorPessoa = usuarios.map(p => ({
    nome: p.nome,
    n: atividades.filter(a => a.responsavel_id === p.id && a.status !== 'Concluído').length
  })).filter(x => x.n > 0).sort((a,b) => b.n - a.n).slice(0, 8);
  const maxCarga = cargaPorPessoa.length ? cargaPorPessoa[0].n : 1;

  const distPorCelula = celulas.map(c => ({
    nome: c.nome,
    n: atividades.filter(a => a.celula_id === c.id && a.status !== 'Concluído').length
  })).sort((a,b) => b.n - a.n);

  /* ---- Bloco 4: ritmo ---- */
  const NUM_SEMANAS = 10;
  const hojeSemana = inicioSemana(new Date());
  const semanas = [];
  for(let i = NUM_SEMANAS - 1; i >= 0; i--){
    const inicioSem = new Date(hojeSemana.getTime() - i*7*86400000);
    const fimSem = new Date(inicioSem.getTime() + 7*86400000);
    const n = concluidas.filter(a => a.data_conclusao && new Date(a.data_conclusao) >= inicioSem && new Date(a.data_conclusao) < fimSem).length;
    semanas.push(n);
  }
  const maxSemana = Math.max(1, ...semanas);
  const pontosLinha = semanas.map((n,i) => {
    const x = (i/(NUM_SEMANAS-1))*540;
    const y = 130 - (n/maxSemana)*110;
    return `${x.toFixed(0)},${y.toFixed(0)}`;
  }).join(' ');
  const areaLinha = `0,150 ${pontosLinha} 540,150`;

  const cicloAtual = mediaCicloDias(concluidasPeriodo);
  const cicloAnterior = mediaCicloDias(concluidasAnterior);
  const deltaCiclo = (cicloAtual !== null && cicloAnterior !== null) ? (cicloAtual - cicloAnterior) : null;

  /* ---- Bloco 5: destaques ---- */
  const pontuacaoPeriodo = usuarios.map(p => ({
    nome: p.nome,
    pts: atividades.filter(a => a.responsavel_id === p.id && a.data_conclusao && new Date(a.data_conclusao) > inicio && new Date(a.data_conclusao) <= fim).reduce((s,a) => s + (a.pontos||0), 0)
  })).filter(x => x.pts > 0).sort((a,b) => b.pts - a.pts);
  const topPontuador = pontuacaoPeriodo[0] || null;
  const celulasComCiclo = celulas.map(c => ({
    nome: c.nome,
    ciclo: mediaCicloDias(concluidas.filter(a => a.celula_id === c.id && a.data_conclusao && new Date(a.data_conclusao) > inicio))
  })).filter(x => x.ciclo !== null);
  const celulaMaisRapida = celulasComCiclo.length ? [...celulasComCiclo].sort((a,b) => a.ciclo - b.ciclo)[0] : null;

  const periodoLabel = { semana:'Semana', mes:'Mês', trimestre:'Trimestre' };

  return `
    <div class="dg-head">
      <div><h2 style="margin:0 0 4px;font-size:1.25rem;font-weight:800;">Visão Geral</h2><p style="margin:0;color:var(--text-soft);font-size:0.85rem;">Panorama consolidado de todas as células · atualizado agora</p></div>
      <div class="period-toggle">
        ${Object.keys(periodoLabel).map(p => `<button class="period-btn ${periodoGeral===p?'active':''}" data-periodo-geral="${p}">${periodoLabel[p]}</button>`).join('')}
      </div>
    </div>

    <div class="dg-section">
      <div class="dg-section-head"><span class="idx">01</span><h3>Resumo do período</h3></div>
      <div class="dg-kpis">
        <div class="dg-kpi"><div class="l">Atividades ativas</div><div class="v">${ativas.length}</div></div>
        <div class="dg-kpi ${totalAtrasadas.length?'alert':''}"><div class="l">Atrasadas</div><div class="v ${totalAtrasadas.length?'alert':''}">${totalAtrasadas.length}</div></div>
        <div class="dg-kpi"><div class="l">Concluídas no período</div><div class="v">${concluidasPeriodo.length}</div>
          ${concluidasAnterior.length || concluidasPeriodo.length ? `<div class="d ${deltaConcluidas<0?'down':''}">${deltaConcluidas>=0?'↑':'↓'} ${Math.abs(deltaConcluidas)}% vs. período anterior</div>` : ''}
        </div>
        <div class="dg-kpi"><div class="l">Taxa de conclusão geral</div><div class="v">${taxaConclusao}%</div></div>
        <div class="dg-kpi"><div class="l">Projetos ativos</div><div class="v">${projetosAtivos}</div></div>
      </div>
    </div>

    <div class="dg-section">
      <div class="dg-section-head"><span class="idx">02</span><h3>Onde está o risco</h3></div>
      <div class="dg-two">
        <div class="dg-panel">
          <h4>Atividades atrasadas — mais críticas primeiro</h4>
          <table class="dg-table">
            <thead><tr><th>Atividade</th><th>Responsável</th><th>Célula</th><th>Atraso</th></tr></thead>
            <tbody>
              ${atrasadasOrdenadas.map(a => `<tr>
                <td>${escapeHtml(a.titulo)}</td>
                <td>${escapeHtml(nomeAbreviado(usuarioNome(a.responsavel_id)))}</td>
                <td>${escapeHtml(celulaNome(a.celula_id))}</td>
                <td><span class="dg-pill ${diasAtraso(a)>7?'risk':'warn'}">${diasAtraso(a)}d</span></td>
              </tr>`).join('') || '<tr><td colspan="4" class="empty">Nada atrasado. 🎉</td></tr>'}
            </tbody>
          </table>
          <div class="dg-sem-row">
            ${semaforoCelulas.map(c => `<div class="dg-sem">
              ${c.cor ? `<span class="dot ${c.cor}"></span>` : ''}<span class="nm">${escapeHtml(c.nome)}</span>
              <span class="pc">${c.ativas ? c.pct+'% atrasadas' : 'sem atividades ativas'}</span>
            </div>`).join('') || ''}
          </div>
        </div>
        <div class="dg-panel">
          <h4>Gargalo de aprovação</h4>
          ${gargalo.map(g => `<div class="dg-gargalo-item"><span>Aguardando com <b>${escapeHtml(g.nome)}</b></span><span class="n">${g.n} parada${g.n===1?'':'s'}</span></div>`).join('') || '<div class="empty">Nenhuma atividade parada em aprovação.</div>'}
        </div>
      </div>
    </div>

    <div class="dg-section">
      <div class="dg-section-head"><span class="idx">03</span><h3>Carga de trabalho</h3></div>
      <div class="dg-two">
        <div class="dg-panel">
          <h4>Atividades abertas por pessoa</h4>
          <div class="dg-bars">
            ${cargaPorPessoa.map(p => `<div class="dg-bar-row">
              <div class="dg-bar-label" title="${escapeHtml(p.nome)}">${escapeHtml(nomeAbreviado(p.nome))}</div>
              <div class="dg-bar-track"><div class="dg-bar-fill ${p.n/maxCarga>0.8?'high':''}" style="width:${(p.n/maxCarga*100).toFixed(0)}%"></div></div>
              <div class="dg-bar-val">${p.n}</div>
            </div>`).join('') || '<div class="empty">Ninguém com atividades abertas.</div>'}
          </div>
        </div>
        <div class="dg-panel">
          <h4>Distribuição por célula</h4>
          ${distPorCelula.map(c => `<div class="dg-dist-row"><span>${escapeHtml(c.nome)}</span><span class="n">${c.n} atividade${c.n===1?'':'s'}</span></div>`).join('') || '<div class="empty">Nenhuma célula cadastrada.</div>'}
        </div>
      </div>
    </div>

    <div class="dg-section">
      <div class="dg-section-head"><span class="idx">04</span><h3>Ritmo do time</h3></div>
      <div class="dg-panel">
        <div class="dg-rhythm">
          <div>
            <h4>Conclusões por semana — últimas ${NUM_SEMANAS} semanas</h4>
            <svg viewBox="0 0 540 150" preserveAspectRatio="none" style="width:100%;height:140px;">
              <defs><linearGradient id="dgLineFade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.16"/>
                <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
              </linearGradient></defs>
              <polyline points="${pontosLinha}" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <polygon points="${areaLinha}" fill="url(#dgLineFade)"/>
            </svg>
          </div>
          <div class="dg-cycle">
            <div class="big">${cicloAtual !== null ? cicloAtual.toFixed(1).replace('.',',') : '—'}</div>
            <div class="sub">dias médios de ciclo<br>(recebimento → conclusão)</div>
            ${deltaCiclo !== null ? `<div class="trend ${deltaCiclo>0?'down':''}">${deltaCiclo<=0?'↓':'↑'} ${Math.abs(deltaCiclo).toFixed(1).replace('.',',')} dia${Math.abs(deltaCiclo)>=1.05||Math.abs(deltaCiclo)<0.95?'s':''} vs. período anterior</div>` : ''}
          </div>
        </div>
      </div>
    </div>

    <div class="dg-section">
      <div class="dg-section-head"><span class="idx">05</span><h3>Destaques do período</h3></div>
      <div class="dg-panel">
        <div class="dg-highlights">
          ${topPontuador ? `<div class="dg-hl-item"><div class="ico">🏆</div><div><div class="t1">${escapeHtml(topPontuador.nome)} liderou o ranking do período</div><div class="t2">${topPontuador.pts} pts acumulados</div></div></div>` : ''}
          ${celulaMaisRapida ? `<div class="dg-hl-item"><div class="ico">⚡</div><div><div class="t1">${escapeHtml(celulaMaisRapida.nome)} foi a célula mais rápida</div><div class="t2">${celulaMaisRapida.ciclo.toFixed(1).replace('.',',')} dias de ciclo médio no período</div></div></div>` : ''}
          <div class="dg-hl-item"><div class="ico">📈</div><div><div class="t1">${concluidasPeriodo.length} atividade${concluidasPeriodo.length===1?'':'s'} concluída${concluidasPeriodo.length===1?'':'s'} no período</div><div class="t2">${deltaConcluidas>=0?'Alta':'Queda'} de ${Math.abs(deltaConcluidas)}% em relação ao período anterior</div></div></div>
        </div>
      </div>
    </div>`;
}

    return `

function itemHtml(a, u, pessoasOpts, mostrarProjeto){

  const prClass = a.prioridade === 'Alta' ? 'pr-alta' : a.prioridade === 'Baixa' ? 'pr-baixa' : 'pr-media';
  const overdue = isOverdue(a);
  const admin = isAdminOrOwner(u);
  const tsk = tarefas.filter(t => t.atividade_id === a.id);
  const doneCount = tsk.filter(t => t.concluida).length;
  const podeExcluirEditar = admin || a.responsavel_id === u.id || u.papel === 'Líder';
  const podeMudarStatus = podeExcluirEditar || a.aprovador_id === u.id;
  const souAprovador = a.aprovador_id === u.id;

  return `
    <div class="item" draggable="true" data-drag-id="${a.id}">

      <div class="top-row">
        <div class="titulo">${escapeHtml(a.titulo)}</div>
        <div class="avatar" title="${escapeHtml(usuarioNome(a.responsavel_id))}">${nomeAbreviado(usuarioNome(a.responsavel_id))}</div>
      </div>
      <div class="meta">
        ${mostrarProjeto ? `<span class="tag" style="background:var(--primary-soft);color:var(--primary);">${escapeHtml(projetoNome(a.projeto_id))}</span>` : ''}
        <span class="tag ${prClass}">${a.prioridade || 'Média'}</span>
        ${empresaNome(a.empresa_id) ? `<span class="tag">${escapeHtml(empresaNome(a.empresa_id))}</span>` : ''}
        ${tsk.length ? `<span class="tag" style="background:var(--success-soft);color:var(--success);">${doneCount}/${tsk.length} tarefas</span>` : ''}
        ${a.aprovador_id ? `<span class="tag" style="background:var(--info-soft);color:var(--info);">${souAprovador ? 'Para sua aprovação' : 'Aprovador: '+escapeHtml(nomeAbreviado(usuarioNome(a.aprovador_id)))}</span>` : ''}
        ${a.prazo_acordado ? `<span class="tag ${overdue?'overdue':''}">${overdue?'Atrasada · ':'Prazo '}${fmtData(a.prazo_acordado)}</span>` : ''}
      </div>
      ${a.observacoes ? `<div class="obs">${escapeHtml(a.observacoes)}</div>` : ''}
      ${a.data_recebimento || a.data_conclusao ? `<div class="admin-dates" style="border-top:none;padding-top:0;">
        ${a.data_recebimento ? `Recebimento: ${fmtData(a.data_recebimento)}` : ''}${a.data_recebimento && a.data_conclusao ? ' · ' : ''}${a.data_conclusao ? `Conclusão: ${fmtDateTime(a.data_conclusao)}` : ''}
      </div>` : ''}
      ${admin ? `<div class="admin-dates">
        Criada: ${fmtDateTime(a.created_at)} · Andamento: ${fmtDateTime(a.data_inicio_andamento)} · Aprovação: ${fmtDateTime(a.data_aprovacao)}
        ${a.pontos ? ` · +${a.pontos} pts` : ''}
      </div>` : ''}
      <div class="actions">
        <select data-status-select="${a.id}" ${podeMudarStatus?'':'disabled'}>
          ${STATUSES.map(s => `<option value="${s}" ${s===a.status?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="tasks-btn" data-toggle-tasks="${a.id}">Tarefas</button>
        ${podeExcluirEditar ? `<button class="edit-btn" data-edit="${a.id}">Editar</button><button class="del" data-del="${a.id}">Excluir</button>` : ''}
      </div>
      ${expandedTasks.has(a.id) ? taskPanelHtml(a.id, tsk, admin) : ''}
    </div>`;
}

function toLocalInputValue(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- Leaderboard ---------- */
function leaderboardHtml(){
  const totals = usuarios.map(u => ({
    nome: u.nome,
    pts: atividades.filter(a => a.responsavel_id === u.id).reduce((s,a) => s + (a.pontos||0), 0)
  })).filter(x => x.pts > 0).sort((a,b) => b.pts - a.pts);
  const max = totals.length ? totals[0].pts : 1;
  if(!totals.length) return '';
  return `<div class="card"><p class="card-title">🏆 Placar da equipe</p>
    <div class="leaderboard">
      ${totals.map((t,i) => `<div class="lb-row">
        <span class="lb-rank">${i+1}º</span><span class="lb-name">${escapeHtml(t.nome)}</span>
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${(t.pts/max*100).toFixed(0)}%"></div></div>
        <span class="lb-pts">${t.pts} pts</span>
      </div>`).join('')}
    </div></div>`;
}

/* ---------- Event wiring ---------- */
function attachListeners(u){
  document.getElementById('btnSair').onclick = async () => { await sb.auth.signOut(); session = null; meuPerfil = null; renderRoot(); };
  document.getElementById('btnTrocarSenha').onclick = () => { showTrocarSenha = !showTrocarSenha; renderAll(); };
  const formSenha = document.getElementById('formTrocarSenha');
  if(formSenha) formSenha.addEventListener('submit', async e => {
    e.preventDefault();
    const s1 = document.getElementById('novaSenha1').value;
    const s2 = document.getElementById('novaSenha2').value;
    if(s1.length < 4) return showError('A senha precisa ter pelo menos 4 caracteres.');
    if(s1 !== s2) return showError('As senhas não coincidem.');
    const { error } = await sb.auth.updateUser({ password: s1 });
    if(error) return showError('Não foi possível trocar a senha.');
    showTrocarSenha = false;
    clearError();
    renderAll();
  });

  const toggleAdmin = document.getElementById('sbToggleAdmin');
  if(toggleAdmin) toggleAdmin.onclick = () => { showAdmin = !showAdmin; renderAll(); };

  const formCelula = document.getElementById('formCelula');
  if(formCelula) formCelula.addEventListener('submit', async e => {
    e.preventDefault();
    const nome = document.getElementById('novaCelulaNome').value.trim();
    if(!nome) return;
    const { error } = await sb.from('celulas').insert([{ nome }]);
    if(error) return showError('Não foi possível criar a célula.');
    await loadAll();
  });

  const formUsuario = document.getElementById('formUsuario');
  if(formUsuario) formUsuario.addEventListener('submit', async e => {
    e.preventDefault();
    const nome = document.getElementById('novoUsuarioNome').value.trim();
    const matricula = document.getElementById('novoUsuarioMatricula').value.trim();
    const email = document.getElementById('novoUsuarioEmail').value.trim();
    const papel = document.getElementById('novoUsuarioPapel').value;
    const celula_id = document.getElementById('novoUsuarioCelula').value || null;
    if(!nome || !email) return showError('Preencha nome e e-mail.');
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Criando…';
    try{
      const { data, error } = await sbSignup.auth.signUp({
        email,
        password: senhaPadrao(matricula, email),
        options: { data: { nome, matricula: matricula || null } }
      });
      if(error) throw error;
      const novoAuthId = data.user.id;
      // aguarda o gatilho criar o perfil, então ajusta papel e célula
      await new Promise(r => setTimeout(r, 700));
      const { error: updError } = await sb.from('usuarios').update({ papel, celula_id }).eq('auth_user_id', novoAuthId);
      if(updError) throw updError;
      clearError();
      await loadAll();
    }catch(err){
      console.error(err);
      showError('Não foi possível cadastrar a pessoa. Confira se a matrícula ou o e-mail já existem e se a confirmação de e-mail está desativada no Supabase.');
    }finally{
      btn.disabled = false; btn.textContent = 'Adicionar';
    }
  });

  const formProjeto = document.getElementById('formProjeto');
  if(formProjeto) formProjeto.addEventListener('submit', async e => {
    e.preventDefault();
    const nome = document.getElementById('novoProjetoNome').value.trim();
    const descricao = document.getElementById('novoProjetoDesc').value.trim() || null;
    const empresa_id = document.getElementById('novoProjetoEmpresa').value || null;
    const celula_id = celulaAtivaId;
    if(!nome || !celula_id) return showError('Preencha o nome do projeto.');
    const { error } = await sb.from('projetos').insert([{ nome, descricao, empresa_id, celula_id, created_by: u.id }]);
    if(error) return showError('Não foi possível criar o projeto.');
    await loadAll();
  });

  const voltarCelulas = document.getElementById('voltarCelulas');
  if(voltarCelulas) voltarCelulas.onclick = () => { celulaAtivaId = null; renderAll(); };
  document.querySelectorAll('[data-open-celula]').forEach(el => {
    el.addEventListener('click', () => { celulaAtivaId = el.dataset.openCelula; renderAll(); });
  });

  document.querySelectorAll('[data-edit-usuario]').forEach(btn => btn.addEventListener('click', e => { editingUserId = e.target.dataset.editUsuario; resetPwdUserId = null; renderAll(); }));
  document.querySelectorAll('[data-cancel-usuario]').forEach(btn => btn.addEventListener('click', () => { editingUserId = null; renderAll(); }));
  document.querySelectorAll('[data-edit-celula]').forEach(btn => btn.addEventListener('click', e => { editingCelulaId = e.target.dataset.editCelula; renderAll(); }));
  document.querySelectorAll('[data-cancel-celula]').forEach(btn => btn.addEventListener('click', () => { editingCelulaId = null; renderAll(); }));
  document.querySelectorAll('[data-save-celula]').forEach(btn => btn.addEventListener('click', e => saveCelula(e.target.dataset.saveCelula)));
  document.querySelectorAll('[data-del-celula]').forEach(btn => btn.addEventListener('click', e => excluirCelula(e.target.dataset.delCelula)));

  const formEmpresa = document.getElementById('formEmpresa');
  if(formEmpresa) formEmpresa.addEventListener('submit', async e => {
    e.preventDefault();
    const nome = document.getElementById('novaEmpresaNome').value.trim();
    if(!nome) return;
    const { error } = await sb.from('empresas').insert([{ nome }]);
    if(error) return showError('Não foi possível criar a empresa.');
    await loadAll();
  });
  document.querySelectorAll('[data-edit-empresa]').forEach(btn => btn.addEventListener('click', e => { editingEmpresaId = e.target.dataset.editEmpresa; renderAll(); }));
  document.querySelectorAll('[data-cancel-empresa]').forEach(btn => btn.addEventListener('click', () => { editingEmpresaId = null; renderAll(); }));
  document.querySelectorAll('[data-save-empresa]').forEach(btn => btn.addEventListener('click', e => saveEmpresa(e.target.dataset.saveEmpresa)));
  document.querySelectorAll('[data-del-empresa]').forEach(btn => btn.addEventListener('click', e => excluirEmpresa(e.target.dataset.delEmpresa)));
  document.querySelectorAll('[data-save-usuario]').forEach(btn => btn.addEventListener('click', e => saveUsuario(e.target.dataset.saveUsuario)));
  document.querySelectorAll('[data-reset-senha]').forEach(btn => btn.addEventListener('click', e => { resetPwdUserId = e.target.dataset.resetSenha; editingUserId = null; renderAll(); }));
  document.querySelectorAll('[data-cancel-senha]').forEach(btn => btn.addEventListener('click', () => { resetPwdUserId = null; renderAll(); }));
  document.querySelectorAll('[data-confirmar-senha]').forEach(btn => btn.addEventListener('click', e => confirmarNovaSenha(e.target.dataset.confirmarSenha)));
  document.querySelectorAll('[data-del-usuario]').forEach(btn => btn.addEventListener('click', e => excluirUsuario(e.target.dataset.delUsuario)));

  const formEditarProjeto = document.getElementById('formEditarProjeto');
  if(formEditarProjeto) formEditarProjeto.addEventListener('submit', async e => {
    e.preventDefault();
    const nome = document.getElementById('editProjetoNome').value.trim();
    const descricao = document.getElementById('editProjetoDesc').value.trim() || null;
    const celula_id = document.getElementById('editProjetoCelula').value;
    const empresa_id = document.getElementById('editProjetoEmpresa').value || null;
    if(!nome || !celula_id) return showError('Preencha nome e célula.');
    const { error } = await sb.from('projetos').update({ nome, descricao, celula_id, empresa_id }).eq('id', projetoAtivoId);
    if(error) return showError('Não foi possível salvar o projeto.');
    editingProjeto = false;
    clearError();
    await loadAll();
  });
  const toggleEditProjeto = document.getElementById('toggleEditProjeto');
  if(toggleEditProjeto) toggleEditProjeto.onclick = () => { editingProjeto = !editingProjeto; renderAll(); };

  document.querySelectorAll('[data-nav]').forEach(btn => btn.addEventListener('click', e => {
    modoVisao = e.currentTarget.dataset.nav;
    projetoAtivoId = null;
    if(modoVisao === 'projetos') celulaAtivaId = null;
    if(modoVisao === 'empresas') empresaAtivaId = null;
    if(modoVisao === 'equipe') membroEquipeId = null;
    renderAll();
  }));

  document.querySelectorAll('[data-periodo-geral]').forEach(btn => {
    btn.addEventListener('click', () => { periodoGeral = btn.dataset.periodoGeral; renderAll(); });
  });

  document.querySelectorAll('[data-open-membro]').forEach(el => {
    el.addEventListener('click', () => { membroEquipeId = el.dataset.openMembro; modoVisao = 'equipe'; renderAll(); });
  });
  const voltarEquipe = document.getElementById('voltarEquipe');
  if(voltarEquipe) voltarEquipe.onclick = () => { membroEquipeId = null; renderAll(); };

  document.querySelectorAll('[data-open-celula-sb]').forEach(el => {
    el.addEventListener('click', () => { celulaAtivaId = el.dataset.openCelulaSb; projetoAtivoId = null; modoVisao = 'projetos'; renderAll(); });
  });

  document.querySelectorAll('[data-open-empresa-sb], [data-open-empresa-card]').forEach(el => {
    el.addEventListener('click', () => {
      empresaAtivaId = el.dataset.openEmpresaSb || el.dataset.openEmpresaCard;
      modoVisao = 'empresas';
      renderAll();
    });
  });
  const voltarEmpresas = document.getElementById('voltarEmpresas');
  if(voltarEmpresas) voltarEmpresas.onclick = () => { empresaAtivaId = null; renderAll(); };

  document.querySelectorAll('[data-open-projeto]').forEach(el => {
    el.addEventListener('click', () => { projetoAtivoId = el.dataset.openProjeto; editingProjeto = false; modoVisao = 'projetos'; renderAll(); });
  });
  const voltar = document.getElementById('voltarProjetos');
  if(voltar) voltar.onclick = () => { projetoAtivoId = null; editingProjeto = false; renderAll(); };

  const addForm = document.getElementById('addForm');
  if(addForm) addForm.addEventListener('submit', async e => {
    e.preventDefault();
    const projetoEscolhidoId = document.getElementById('projetoAtividade').value;
    const p = projetos.find(pr => pr.id === projetoEscolhidoId) || projetos.find(pr => pr.id === projetoAtivoId);
    const titulo = document.getElementById('titulo').value.trim();
    const responsavel_id = document.getElementById('responsavel').value;
    const prioridade = document.getElementById('prioridade').value;
    const data_recebimento = document.getElementById('dataRecebimento')?.value || null;
    const prazo_acordado = document.getElementById('prazoAcordado')?.value || null;
    const observacoes = document.getElementById('observacoes').value.trim() || null;
    const empresa_id = document.getElementById('empresa').value || null;
    if(!titulo || !responsavel_id) return showError('Preencha ao menos o título e o responsável.');
    const btn = e.target.querySelector('.add-btn');
    btn.disabled = true; btn.textContent = 'Salvando…';
    try{
      const { error } = await sb.from('atividades').insert([{
        titulo, responsavel_id, prioridade, data_recebimento, prazo_acordado, observacoes, empresa_id,
        status:'A fazer', projeto_id: p.id, celula_id: p.celula_id
      }]);
      if(error) throw error;
      clearError();
      await loadAll();
    }catch(err){ console.error(err); showError('Não foi possível salvar a atividade.'); }
    finally{ btn.disabled = false; btn.textContent = 'Adicionar'; }
  });

  document.querySelectorAll('[data-status-select]').forEach(sel => {
    sel.addEventListener('change', e => solicitarMudancaStatus(e.target.dataset.statusSelect, e.target.value));
  });
  document.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', e => deleteAtividade(e.target.dataset.del)));
  document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', e => { editingId = e.target.dataset.edit; renderAll(); }));
  document.querySelectorAll('[data-cancel-edit]').forEach(btn => btn.addEventListener('click', () => { editingId = null; renderAll(); }));
  document.querySelectorAll('[data-save-edit]').forEach(btn => btn.addEventListener('click', e => saveEdit(e.target.dataset.saveEdit)));
  document.querySelectorAll('[data-toggle-tasks]').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.dataset.toggleTasks;
    expandedTasks.has(id) ? expandedTasks.delete(id) : expandedTasks.add(id);
    renderAll();
  }));

  document.querySelectorAll('[data-drag-id]').forEach(el => {
    el.addEventListener('mousedown', e => {
      el.draggable = !e.target.closest('button, select, input, textarea, a, .task-panel');
    });
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', el.dataset.dragId);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => el.classList.add('dragging'), 0);
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); el.draggable = true; });
  });
  document.querySelectorAll('[data-col-status]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const novoStatus = col.dataset.colStatus;
      if(id && novoStatus) solicitarMudancaStatus(id, novoStatus);
    });
  });
  document.querySelectorAll('[data-toggle-task]').forEach(cb => cb.addEventListener('change', e => toggleTarefa(e.target.dataset.toggleTask, e.target.checked)));
  document.querySelectorAll('[data-save-task-date]').forEach(btn => btn.addEventListener('click', e => saveTaskDate(e.target.dataset.saveTaskDate)));
  document.querySelectorAll('[data-del-task]').forEach(btn => btn.addEventListener('click', e => deleteTarefa(e.target.dataset.delTask)));
  document.querySelectorAll('[data-add-task]').forEach(btn => btn.addEventListener('click', e => {
    const atividadeId = e.target.dataset.addTask;
    const input = document.querySelector(`[data-new-task-input="${atividadeId}"]`);
    addTarefa(atividadeId, input.value.trim());
  }));
}

async function saveEmpresa(id){
  const el = document.querySelector(`[data-save-empresa="${id}"]`).closest('.mini-item');
  const nome = el.querySelector('[data-ef="nome"]').value.trim();
  if(!nome) return showError('Digite um nome para a empresa.');
  try{
    const { error } = await sb.from('empresas').update({ nome }).eq('id', id);
    if(error) throw error;
    editingEmpresaId = null; clearError(); await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível salvar a empresa: ' + err.message); }
}

async function excluirEmpresa(id){
  const emUso = atividades.some(a => a.empresa_id === id);
  if(emUso && !confirm('Essa empresa está associada a atividades. Elas ficarão sem empresa. Continuar?')) return;
  try{
    const { error } = await sb.from('empresas').delete().eq('id', id);
    if(error) throw error;
    clearError(); await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível excluir a empresa: ' + err.message); }
}

async function saveCelula(id){
  const el = document.querySelector(`[data-save-celula="${id}"]`).closest('.mini-item');
  const nome = el.querySelector('[data-cf="nome"]').value.trim();
  if(!nome) return showError('Digite um nome para a célula.');
  try{
    const { error } = await sb.from('celulas').update({ nome }).eq('id', id);
    if(error) throw error;
    editingCelulaId = null; clearError(); await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível salvar a célula: ' + err.message); }
}

async function excluirCelula(id){
  const temPessoas = usuarios.some(u2 => u2.celula_id === id);
  const temProjetos = projetos.some(p => p.celula_id === id);
  if(temProjetos){ return showError('Essa célula tem projetos vinculados — mova ou exclua os projetos dela primeiro.'); }
  if(temPessoas && !confirm('Essa célula tem pessoas vinculadas. Elas ficarão sem célula. Continuar?')) return;
  try{
    const { error } = await sb.from('celulas').delete().eq('id', id);
    if(error) throw error;
    clearError(); await loadAll();
  }catch(err){
    console.error(err);
    showError('Não foi possível excluir a célula: ' + err.message);
  }
}

async function saveUsuario(id){
  const el = document.querySelector(`[data-save-usuario="${id}"]`).closest('.mini-item');
  const nome = el.querySelector('[data-uf="nome"]').value.trim();
  const matricula = el.querySelector('[data-uf="matricula"]').value.trim();
  const papel = el.querySelector('[data-uf="papel"]').value;
  const celula_id = el.querySelector('[data-uf="celula_id"]').value || null;
  if(!nome || !matricula) return showError('Preencha nome e matrícula.');
  try{
    const { error } = await sb.from('usuarios').update({ nome, matricula, papel, celula_id }).eq('id', id);
    if(error) throw error;
    editingUserId = null; clearError(); await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível salvar: ' + err.message); }
}

async function chamarAdminUsuarios(payload){
  const { data, error } = await sb.functions.invoke('admin-usuarios', { body: payload });
  if(error) throw error;
  if(data && data.error) throw new Error(data.error);
  return data;
}

async function confirmarNovaSenha(authUserId){
  const senha = document.getElementById('novaSenhaUsuario').value;
  if(!senha || senha.length < 6) return showError('A senha precisa ter pelo menos 6 caracteres.');
  try{
    await chamarAdminUsuarios({ action:'reset_password', target_auth_user_id: authUserId, new_password: senha });
    resetPwdUserId = null; clearError(); renderAll();
  }catch(err){ console.error(err); showError('Não foi possível redefinir a senha: ' + err.message); }
}

async function excluirUsuario(authUserId){
  if(!authUserId) return showError('Essa pessoa não tem login vinculado.');
  if(!confirm('Excluir essa pessoa? O acesso dela será removido imediatamente.')) return;
  try{
    await chamarAdminUsuarios({ action:'delete_user', target_auth_user_id: authUserId });
    clearError(); await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível excluir: ' + err.message); }
}

async function saveEdit(id){
  const item = document.querySelector(`[data-save-edit="${id}"]`).closest('.item');
  const titulo = item.querySelector('[data-f="titulo"]').value.trim();
  const responsavel_id = item.querySelector('[data-f="responsavel_id"]').value;
  const prioridade = item.querySelector('[data-f="prioridade"]').value;
  const observacoes = item.querySelector('[data-f="observacoes"]').value.trim() || null;
  const payload = { titulo, responsavel_id, prioridade, observacoes };
  const campoProjeto = item.querySelector('[data-f="projeto_id"]');
  if(campoProjeto){
    const novoProjeto = projetos.find(pr => pr.id === campoProjeto.value);
    if(novoProjeto){ payload.projeto_id = novoProjeto.id; payload.celula_id = novoProjeto.celula_id; }
  }
  const campoEmpresa = item.querySelector('[data-f="empresa_id"]');
  if(campoEmpresa) payload.empresa_id = campoEmpresa.value || null;
  const campoRecebimento = item.querySelector('[data-f="data_recebimento"]');
  const campoPrazo = item.querySelector('[data-f="prazo_acordado"]');
  const campoConclusao = item.querySelector('[data-f="data_conclusao"]');
  if(campoRecebimento) payload.data_recebimento = campoRecebimento.value || null;
  if(campoPrazo) payload.prazo_acordado = campoPrazo.value || null;
  if(campoConclusao) payload.data_conclusao = campoConclusao.value ? new Date(campoConclusao.value).toISOString() : null;
  if(!titulo){ showError('Preencha o título antes de salvar.'); return; }
  const saveBtn = item.querySelector('[data-save-edit]');
  saveBtn.disabled = true; saveBtn.textContent = 'Salvando…';
  try{
    const { error } = await sb.from('atividades').update(payload).eq('id', id);
    if(error) throw error;
    editingId = null; clearError(); await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível salvar as alterações: ' + err.message); saveBtn.disabled=false; saveBtn.textContent='Salvar'; }
}

function solicitarMudancaStatus(id, status){
  if(status === 'Em aprovação'){
    aprovacaoPendente = id;
    renderAll();
  } else {
    updateStatus(id, status);
  }
}

async function updateStatus(id, status){
  try{ const { error } = await sb.from('atividades').update({ status }).eq('id', id); if(error) throw error; await loadAll(); }
  catch(err){ console.error(err); showError('Não foi possível atualizar o status.'); }
}
async function confirmarAprovador(id, aprovador_id){
  if(!aprovador_id) return showError('Escolha quem vai aprovar.');
  try{
    const { error } = await sb.from('atividades').update({ status:'Em aprovação', aprovador_id }).eq('id', id);
    if(error) throw error;
    aprovacaoPendente = null; clearError(); await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível definir o aprovador: ' + err.message); }
}
async function deleteAtividade(id){
  if(!confirm('Excluir esta atividade e suas tarefas?')) return;
  try{ const { error } = await sb.from('atividades').delete().eq('id', id); if(error) throw error; await loadAll(); }
  catch(err){ console.error(err); showError('Não foi possível excluir a atividade.'); }
}
async function toggleTarefa(id, concluida){
  try{ const { error } = await sb.from('tarefas').update({ concluida }).eq('id', id); if(error) throw error; await loadAll(); }
  catch(err){ console.error(err); showError('Não foi possível atualizar a tarefa.'); }
}
async function saveTaskDate(id){
  const input = document.querySelector(`[data-task-date="${id}"]`);
  if(!input.value) return showError('Escolha uma data e hora.');
  const iso = new Date(input.value).toISOString();
  try{ const { error } = await sb.from('tarefas').update({ concluida_em: iso }).eq('id', id); if(error) throw error; clearError(); await loadAll(); }
  catch(err){ console.error(err); showError('Não foi possível salvar a data: ' + err.message); }
}
async function deleteTarefa(id){
  try{ const { error } = await sb.from('tarefas').delete().eq('id', id); if(error) throw error; await loadAll(); }
  catch(err){ console.error(err); showError('Não foi possível remover a tarefa.'); }
}
async function addTarefa(atividadeId, titulo){
  if(!titulo) return;
  try{
    const { error } = await sb.from('tarefas').insert([{ atividade_id: atividadeId, titulo }]);
    if(error) throw error;
    expandedTasks.add(atividadeId);
    await loadAll();
  }catch(err){ console.error(err); showError('Não foi possível adicionar a tarefa.'); }
}

boot();
</script>
</body>
</html>
